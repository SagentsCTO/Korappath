name: Generate RSS feed

on:
  push:
    branches: [main]
    paths:
      - 'stories.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate feed.xml
        run: python scripts/generate_feed.py

      - name: Commit and push if feed.xml changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Auto-update feed.xml from stories.json"
          git push
